name: Publish game to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch(url, { headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'Cache-Control': 'no-cache',
            } });
            if (!response.ok) throw new Error(`Artifact lookup failed: HTTP ${response.status}`);
            const { artifacts } = await response.json();
            const matching = artifacts.filter(a => a.name === process.env.ARTIFACT_NAME && !a.expired);
            if (matching.length === 1) {
              console.log('Pages artifact is ready for deployment.');
              process.exit(0);
            }
            if (matching.length > 1) throw new Error('Duplicate Pages artifact for this attempt.');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Pages artifact did not become visible within one minute.');
          NODE
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
